version: '3.8'

services:
  auto-trader:
    build: .
    container_name: auto-trader-okx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These will be overridden by values in .env if present
      # We map them here explicitly to ensure they are passed to the container
      # if the user sets them in the shell or .env
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - OKX_FLAG=${OKX_FLAG:-0}
      - TRADE_SYMBOL=${TRADE_SYMBOL:-BTC-USDT}
      - TRADE_INTERVAL=${TRADE_INTERVAL:-1H}

    volumes:
      - .:/app
      - ./config/settings.yaml:/app/config/settings.yaml
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data/history:/app/data/history
      - ./data/cache:/app/data/cache
      - ./charts:/app/charts
      - ./status.json:/app/status.json
    # If you are on Linux, you might want to add user mapping
    # to avoid permission issues with the created files.
    # user: "${UID}:${GID}"

