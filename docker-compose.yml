version: '3.8'

services:
  # Service A: The original ML-driven bot (Price Prediction)
  auto-trader-ml:
    build: .
    container_name: auto-trader-ml
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - OKX_FLAG=${OKX_FLAG:-0}
    volumes:
      - .:/app
      - ./config/settings.yaml:/app/config/settings.yaml
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data/history:/app/data/history
      - ./data/cache:/app/data/cache
      - ./charts:/app/charts
      - ./status.json:/app/status.json
    command: python run_live.py

  # Service B: The new Funding Arb bot (Structural Alpha)
  auto-trader-arb:
    build: .
    container_name: auto-trader-arb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - OKX_FLAG=${OKX_FLAG:-0}
    volumes:
      - .:/app
      - ./config/settings.yaml:/app/config/settings.yaml
      - ./logs:/app/logs
    # Explicitly run the simple arb script
    command: python run_live_simple.py --strategy funding_arb --symbol BTC/USDT
    deploy:
      resources:
        limits:
          memory: 512M
